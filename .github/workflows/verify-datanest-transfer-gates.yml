name: Verify DataNest transfer gates

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/consolidation/repository-transfer-manifest.yaml"
      - "scripts/verify-datanest-transfer-gates.ts"
      - "scripts/lib/datanest-transfer-gates.test.ts"
      - ".github/workflows/verify-datanest-transfer-gates.yml"
  push:
    branches: [main]
    paths:
      - "docs/consolidation/repository-transfer-manifest.yaml"
      - "scripts/verify-datanest-transfer-gates.ts"
      - "scripts/lib/datanest-transfer-gates.test.ts"
      - ".github/workflows/verify-datanest-transfer-gates.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DataNest transfer gate invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Test transfer-gate verifier
        run: bun test scripts/lib/datanest-transfer-gates.test.ts

      - name: Verify manifest against live Hub main protection state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/verify-datanest-transfer-gates.ts
